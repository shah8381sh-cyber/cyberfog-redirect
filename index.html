```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CYBER FOG HUB</title>
</head>
<body>
  <h2>CYBER FOG HUB</h2>
  <p id="status">Connecting to the hub...</p>

  <script>
    async function connectToHub() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "/current-url.json?v=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error("URL unavailable");

        const data = await response.json();

        if (!data.url ||
            !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(data.url)) {
          throw new Error("Invalid hub address");
        }

        const target = new URL(data.url);
        target.pathname = location.pathname;
        target.search = location.search;
        target.hash = location.hash;

        status.textContent = "Connecting...";
        window.location.replace(target.href);

      } catch (error) {
        status.textContent = "Hub temporarily unavailable. Please try again later.";
      }
    }

    connectToHub();
  </script>
</body>
</html>
